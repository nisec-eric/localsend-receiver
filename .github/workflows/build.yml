name: Build Release APK

on:
  push:
    tags: ['v*']

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > localsend-release.jks

      - name: Generate fallback keystore (no secret)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkeypair -v \
            -keystore localsend-release.jks \
            -storepass localsend123 \
            -alias localsend \
            -keypass localsend123 \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=LocalSend,OU=CI,O=LocalSend,L=City,ST=State,C=US"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/localsend-receiver-${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/localsend-receiver-*.apk
          generate_release_notes: true
